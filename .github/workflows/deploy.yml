name: CI — Trudon ERP

# Publicação do site é feita pela branch `gh-pages` (GitHub Pages → "Deploy from a branch").
# Este workflow é apenas o portão de qualidade: roda testes e build a cada push.

on:
  push:
    branches:
      - claude/accounting-app-review-qffa5p
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test
      - run: npm run build
